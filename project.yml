name: LibreSensorExport
options:
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
fileGroups:
  - Config/Config.xcconfig
  - Config/Local.xcconfig.example
targets:
  LibreSensorExport:
    type: application
    platform: iOS
    sources: [Sources]
    configFiles:
      Debug: Config/Config.xcconfig
      Release: Config/Config.xcconfig
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Libre Export
        NFCReaderUsageDescription: "Reads your FreeStyle Libre sensor over NFC to export its data for your own analysis."
        UILaunchScreen: {}
    entitlements:
      path: Generated/LibreSensorExport.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats: [TAG]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIBRE_EXPORT_BUNDLE_ID)
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
