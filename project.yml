name: LibreSensorExport
options:
  bundleIdPrefix: org.libresensorexport
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
targets:
  LibreSensorExport:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Libre Export
        NFCReaderUsageDescription: "Reads your FreeStyle Libre sensor over NFC to export its data for your own analysis."
        UILaunchScreen: {}
    entitlements:
      path: Generated/LibreSensorExport.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats: [TAG]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.libresensorexport.app
        DEVELOPMENT_TEAM: YOURTEAMID
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
